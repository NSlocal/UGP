name: Build Optimized Release APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK (arm64-v8a)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE" | base64 -d > app/keystore.jks
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK (V1 + V2 + V3)
        run: |
          apksigner sign --ks app/keystore.jks \
            --ks-pass pass:$KEYSTORE_PASS \
            --key-pass pass:$KEY_PASS \
            --ks-key-alias $KEY_ALIAS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/app-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/app-signed.apk
          
