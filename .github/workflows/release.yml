name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 🔧 Auto-Fix Gradle Wrapper
        run: |
          echo "📂 Checking Gradle Wrapper files..."
          mkdir -p gradle/wrapper
          
          # Download missing gradle-wrapper.jar
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "📥 Downloading gradle-wrapper.jar..."
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle-wrapper.jar
            echo "✅ gradle-wrapper.jar downloaded"
          fi
          
          # Create gradle-wrapper.properties if missing
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📄 Creating gradle-wrapper.properties..."
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=60000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            echo "✅ gradle-wrapper.properties created"
          fi
          
          # Make gradlew executable
          chmod +x ./gradlew
          echo "✅ All Gradle Wrapper files ready!"
          ls -la ./gradlew gradle/wrapper/

      - name: 🔑 Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            ls -lh app/keystore.jks
          else
            echo "⚠️ No KEYSTORE_BASE64 — building UNSIGNED APK"
            touch app/keystore.jks
          fi

      - name: 🚀 Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            --stacktrace

      - name: ✅ Verify Built APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "❌ ERROR: APK directory missing!"
            exit 1
          fi
          echo "✅ APK files found:"
          ls -lh "$APK_DIR"/*.apk || {
            echo "❌ No APK files generated!"
            exit 1
          }

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## ✅ Build Success — Universal Performance
            - **Package**: `com.universal.performance`
            - **Arch**: `arm64-v8a` only
            - **Signing**: V1 + V2 + V3
            - **Android**: 5.0+ (API 21) — 16+
            - **Optimizations**: R8, ProGuard, zipalign
            - **Build SHA**: `${{ github.sha }}`
