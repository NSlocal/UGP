name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ CARA PALING AMAN — Pakai Gradle Wrapper Generator Resmi
      - name: Setup Gradle Wrapper — Download JAR Resmi
        run: |
          mkdir -p gradle/wrapper
          # 🔗 LINK RESMI & BENAR — dari repo Gradle GitHub
          curl -L -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/subprojects/wrapper/src/main/resources/org/gradle/wrapper/gradle-wrapper.jar"
          # Verifikasi file terunduh benar
          ls -la gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission
        run: |
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/*/*.apk
          
