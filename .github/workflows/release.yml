name: Build & Release APK
run-name: Release — ${{ github.sha }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: 🛠️ Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --parallel

      - name: ✅ Verify APK exists
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-v${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          body: |
            ## 📱 Universal Performance — Release Build
            - **Arch**: arm64-v8a only
            - **Signing**: V1 + V2 + V3
            - **Android**: 5.0+ (API 21)
            - **Optimizations**: R8, resource shrinking, zipalign
            - **Build hash**: ${{ github.sha }}
            
