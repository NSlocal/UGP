name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 🔧 Auto-Fix Gradle Wrapper
        run: |
          echo "📂 Current files:"
          ls -la
          
          # Check if gradlew exists
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew NOT FOUND — generating wrapper..."
            sudo apt-get update -y
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5
          fi
          
          # Always make executable
          chmod +x ./gradlew
          echo "✅ gradlew ready & executable"
          ls -la ./gradlew

      - name: 🔑 Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            ls -lh app/keystore.jks
          else
            echo "⚠️ No KEYSTORE_BASE64 — building UNSIGNED APK"
            touch app/keystore.jks
          fi

      - name: 🚀 Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            --stacktrace

      - name: ✅ Verify Built APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "❌ ERROR: APK directory missing!"
            exit 1
          fi
          echo "✅ APK files found:"
          ls -lh "$APK_DIR"/*.apk || {
            echo "❌ No APK files generated!"
            exit 1
          }

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## ✅ Build Success — Universal Performance
            - **Package**: `com.universal.performance`
            - **Arch**: `arm64-v8a` only
            - **Signing**: V1 + V2 + V3
            - **Android**: 5.0+ (API 21) — 16+
            - **Optimizations**: R8, ProGuard, zipalign
            - **Build SHA**: `${{ github.sha }}`
            - **Built at**: ${{ github.event.head_commit.timestamp }}
            
