name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 AUTO-CREATE ALL GRADLE WRAPPER FILES!
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: 🔑 Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          fi

      - name: 🚀 Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: ✅ Verify APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          [ -d "$APK_DIR" ] || exit 1
          ls -lh "$APK_DIR"/*.apk || exit 1

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          
