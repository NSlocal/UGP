name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Create FULL Gradle Wrapper (All Files!)
        run: |
          mkdir -p gradle/wrapper
          
          # Step 1: Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=60000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          
          # Step 2: Download gradle-wrapper.jar from OFFICIAL source
          echo "📥 Downloading gradle-wrapper.jar..."
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle-wrapper.jar
          
          # Verify JAR downloaded
          JAR_SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "✅ gradle-wrapper.jar size: $JAR_SIZE bytes"
          if [ "$JAR_SIZE" -lt 50000 ]; then
            echo "❌ Download failed! File too small!"
            exit 1
          fi
          
          # Step 3: Create gradlew script if missing
          if [ ! -f "./gradlew" ]; then
            echo "📄 Creating gradlew script..."
            cat > gradlew << 'ENDSCRIPT'
#!/bin/sh
APP_HOME=$( cd "$(dirname "$0")" && pwd )
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
if [ ! -f "$CLASSPATH" ]; then
  echo "ERROR: $CLASSPATH not found!"; exit 1
fi
exec java -Xmx64m -Xms64m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
ENDSCRIPT
          fi
          
          # Make executable
          chmod +x ./gradlew
          
          # Final verification
          echo "✅ All Gradle Wrapper files ready!"
          ls -la ./gradlew gradle/wrapper/
        shell: bash

      - name: 🔑 Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          else
            touch app/keystore.jks
          fi

      - name: 🚀 Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --parallel \
            --stacktrace

      - name: ✅ Verify APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          [ -d "$APK_DIR" ] || exit 1
          ls -lh "$APK_DIR"/*.apk || exit 1

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          
