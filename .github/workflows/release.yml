jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ TAMBAH 2 BARIS INI — KUNCI UTAMA!!!
      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5

      - name: Build APK
        run: ./gradlew assembleRelease
