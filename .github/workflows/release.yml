name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Gradle Wrapper Files
        run: |
          mkdir -p gradle/wrapper
          
          # Create gradle-wrapper.properties
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=60000" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Download gradle-wrapper.jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle-wrapper.jar
          
          # Verify JAR size
          JAR_SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "JAR size: $JAR_SIZE bytes"
          if [ "$JAR_SIZE" -lt 50000 ]; then exit 1; fi
          
          # Create gradlew if missing
          if [ ! -f "./gradlew" ]; then
            echo "#!/bin/sh" > gradlew
            echo 'APP_HOME=$( cd "$(dirname "$0")" && pwd )' >> gradlew
            echo 'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' >> gradlew
            echo 'exec java -Xmx64m -Xms64m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          fi
          
          chmod +x ./gradlew
          ls -la ./gradlew gradle/wrapper/

      - name: 🔑 Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          else
            touch app/keystore.jks
          fi

      - name: 🚀 Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --parallel \
            --stacktrace

      - name: ✅ Verify APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          [ -d "$APK_DIR" ] || exit 1
          ls -lh "$APK_DIR"/*.apk || exit 1

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          
