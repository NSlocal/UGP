name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 🔑 Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          ls -lh app/keystore.jks
        shell: bash

      - name: 🛠️ Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --parallel --stacktrace
        shell: bash

      - name: ✅ Verify APK exists
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "❌ APK directory missing!"
            exit 1
          fi
          ls -lh "$APK_DIR"/*.apk || {
            echo "❌ No APK files generated!"
            exit 1
          }
        shell: bash

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Universal Performance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## ✅ Build Success — Universal Performance
            - **Package**: `com.universal.performance`
            - **Arch**: `arm64-v8a` only
            - **Signing**: V1 + V2 + V3
            - **Android**: 5.0+ (API 21) — 16+
            - **Optimizations**: R8, ProGuard, zipalign
            - **Build SHA**: `${{ github.sha }}`
            
