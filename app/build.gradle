plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.universal.performance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 21                          // Android 5.0+
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // ARM64 ONLY → smaller, faster builds
        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // 🔐 Signing — V1 + V2 + V3 all enabled
    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: project.findProperty('storePassword')
            keyAlias System.getenv('KEY_ALIAS') ?: project.findProperty('keyAlias')
            keyPassword System.getenv('KEY_PASS') ?: project.findProperty('keyPassword')
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true              // ✅ R8 code shrinking
            shrinkResources true            // ✅ Remove unused resources
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.release
            zipAlignEnabled true           // ✅ Align for faster loading
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Performance optimizations
    packagingOptions {
        resources {
            excludes += ['/META-INF/*.version', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
