plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.20'  // ✅ WAJIB 1.9.20!
}

android {
    namespace 'com.universal.performance'
    compileSdk 34

    defaultConfig {
        applicationId "com.universal.performance"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // ✅ WAJIB 17!
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'  // ✅ WAJIB 17 — SAMA DI ATAS!
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
